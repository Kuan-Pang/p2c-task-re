[project]
name = "p2c-task-re"
version = "0.1.0"
description = "Turns papers2cells perturbation triplets and their source papers into Harbor benchmark tasks with rubrics."
readme = "README.md"
authors = [
    { name = "Kuan Pang", email = "kuanpang@stanford.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.75",
    "hydra-core>=1.3.8,<1.4",
    "openai>=2.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Harbor is heavy (litellm, supabase, fastmcp, ...) and only needed to run or validate Harbor jobs.
harbor = ["harbor>=0.26"]

[project.scripts]
p2c-pipeline = "p2c_task_re.cli:main"
p2c-grade = "p2c_task_re.grading.grade:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real model API or reads the /lfs corpus (deselected by default; run with -m live)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
